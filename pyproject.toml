[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-mcp-server"
version = "0.1.0"
description = "Hierarchical MCP server for skill management with search and web UI"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
skills-mcp-server = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
